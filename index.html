<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Visitas y Clientes</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--primary-color);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            background-color: #fafbfc;
            transition: border-color 0.2s, background-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            background-color: #fff;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.92;
        }

        .btn-secondary {
            background-color: #718096;
        }

        .actions-bar {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .table-container {
            margin-top: 30px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
            font-size: 0.95rem;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f8fafc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Gestor de Visitas y Clientes</h1>

        <div class="form-grid">
            <div class="form-group full-width">
                <label for="clientName">Nombre del Cliente:</label>
                <input type="text" id="clientName" placeholder="Ingrese el nombre completo...">
            </div>

            <div class="form-group full-width">
                <label for="clientNotes">Notas de la Visita:</label>
                <textarea id="clientNotes" rows="3" placeholder="Detalles, acuerdos o temas tratados..."></textarea>
            </div>
        </div>

        <button onclick="addClient()">Guardar Registro</button>

        <div class="actions-bar">
            <button class="btn-secondary" onclick="exportBackup()">Exportar Respaldo JSON</button>
            <button class="btn-secondary" onclick="exportClientsTxt()">Exportar Lista TXT</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Fecha (DD-MM-YYYY)</th>
                        <th>Cliente</th>
                        <th>Notas</th>
                    </tr>
                </thead>
                <tbody id="clientTableBody">
                    <!-- Los registros se cargan dinámicamente aquí -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let clients = [];

        // Función estricta para generar formato DD-MM-YYYY
        function getSerializationDate() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            return `${day}-${month}-${year}`;
        }

        // --- SISTEMA DE DESCARGA ADAPTATIVO (WEBVIEW NATIVO O NAVEGADOR) ---
        function triggerLocalDownload(content, fileName, mimeType) {
            // Si estamos dentro de la app Android con el puente nativo instalado
            if (window.AndroidApp && typeof window.AndroidApp.guardarJSON === 'function') {
                try {
                    window.AndroidApp.guardarJSON(fileName, content);
                    return;
                } catch (e) {
                    console.error("Error al usar el puente nativo:", e);
                }
            }

            // Fallback para navegador web normal (PC / Móvil web)
            const base64 = btoa(unescape(encodeURIComponent(content)));
            const dataUri = `data:${mimeType};base64,${base64}`;

            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = dataUri;
            downloadAnchor.download = fileName;
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            document.body.removeChild(downloadAnchor);
        }

        function addClient() {
            const nameInput = document.getElementById('clientName');
            const notesInput = document.getElementById('clientNotes');

            if (!nameInput.value.trim()) {
                alert("Por favor, ingrese el nombre del cliente.");
                return;
            }

            const newRecord = {
                id: Date.now(),
                date: getSerializationDate(),
                name: nameInput.value.trim(),
                notes: notesInput.value.trim()
                // Nota: Omitido intencionalmente cualquier cálculo de totales según directrices
            };

            clients.push(newRecord);
            renderTable();

            nameInput.value = '';
            notesInput.value = '';
        }

        function renderTable() {
            const tbody = document.getElementById('clientTableBody');
            tbody.innerHTML = '';

            clients.forEach(c => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${c.date}</td>
                    <td>${escapeHtml(c.name)}</td>
                    <td>${escapeHtml(c.notes)}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        function exportBackup() {
            const dataStr = JSON.stringify(clients, null, 2);
            const fileName = `visitas_backup_${getSerializationDate()}.json`;
            triggerLocalDownload(dataStr, fileName, 'application/json');
        }

        function exportClientsTxt() {
            let textContent = "";
            clients.forEach(c => {
                textContent += `${c.date},${c.name},${c.notes}\n`;
            });
            const fileName = `lista_clientes_${getSerializationDate()}.txt`;
            triggerLocalDownload(textContent, fileName, 'text/plain');
        }
    </script>
</body>
</html>
