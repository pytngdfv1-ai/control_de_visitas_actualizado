<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Visitas y Clientes</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #1a1a1a;          /* Fondo oscuro original */
            --card-bg: #2d2d2d;           /* Tarjeta con tono oscuro */
            --text-color: #f0f0f0;        /* Texto claro */
            --border-color: #404040;      /* Bordes más sutiles */
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            line-height: 1.25;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        h1 {
            color: var(--text-color);
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #ddd;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            background-color: #333;
            color: #fff;
            border-radius: 4px;
            font-size: 1rem;
        }

        input::placeholder, textarea::placeholder {
            color: #888;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background-color: #555;
        }

        .actions-bar {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid var(--border-color);
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: var(--primary-color);
            color: white;
        }

        td {
            background-color: #262626;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Gestor de Visitas</h1>

        <div class="form-group">
            <label for="clientName">Nombre del Cliente:</label>
            <input type="text" id="clientName" placeholder="Ingrese el nombre...">
        </div>

        <div class="form-group">
            <label for="clientNotes">Notas de la Visita:</label>
            <textarea id="clientNotes" rows="3" placeholder="Detalles de la visita..."></textarea>
        </div>

        <button onclick="addClient()">Guardar Registro</button>

        <div class="actions-bar">
            <button class="btn-secondary" onclick="exportBackup()">Exportar JSON</button>
            <button class="btn-secondary" onclick="exportClientsTxt()">Exportar TXT</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Fecha (DD-MM-YYYY)</th>
                    <th>Cliente</th>
                    <th>Notas</th>
                </tr>
            </thead>
            <tbody id="clientTableBody">
                <!-- Los registros se cargan dinámicamente aquí -->
            </tbody>
        </table>
    </div>

    <script>
        let clients = [];

        // Función estricta para generar formato DD-MM-YYYY
        function getSerializationDate() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            return `${day}-${month}-${year}`;
        }

        // --- SISTEMA DE DESCARGA ADAPTATIVO (WEBVIEW NATIVO O NAVEGADOR) ---
        function triggerLocalDownload(content, fileName, mimeType) {
            // Si estamos dentro de la app Android con el puente nativo instalado
            if (window.AndroidApp && typeof window.AndroidApp.guardarJSON === 'function') {
                try {
                    window.AndroidApp.guardarJSON(fileName, content);
                    return;
                } catch (e) {
                    console.error("Error al usar el puente nativo:", e);
                }
            }

            // Fallback para navegador web normal (PC / Chrome)
            const base64 = btoa(unescape(encodeURIComponent(content)));
            const dataUri = `data:${mimeType};base64,${base64}`;

            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = dataUri;
            downloadAnchor.download = fileName;
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            document.body.removeChild(downloadAnchor);
        }

        function addClient() {
            const nameInput = document.getElementById('clientName');
            const notesInput = document.getElementById('clientNotes');

            if (!nameInput.value.trim()) {
                alert("Por favor, ingrese el nombre del cliente.");
                return;
            }

            const newRecord = {
                id: Date.now(),
                date: getSerializationDate(),
                name: nameInput.value.trim(),
                notes: notesInput.value.trim()
                // Nota: Se omiten intencionalmente cálculos de totales para cumplir con los parámetros de la estructura
            };

            clients.push(newRecord);
            renderTable();

            nameInput.value = '';
            notesInput.value = '';
        }

        function renderTable() {
            const tbody = document.getElementById('clientTableBody');
            tbody.innerHTML = '';

            clients.forEach(c => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${c.date}</td>
                    <td>${escapeHtml(c.name)}</td>
                    <td>${escapeHtml(c.notes)}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        function exportBackup() {
            const dataStr = JSON.stringify(clients, null, 2);
            const fileName = `visitas_backup_${getSerializationDate()}.json`;
            triggerLocalDownload(dataStr, fileName, 'application/json');
            alert("El archivo se está guardando localmente.");
        }

        function exportClientsTxt() {
            let textContent = "";
            clients.forEach(c => {
                textContent += `${c.date},${c.name},${c.notes}\n`;
            });
            const fileName = `lista_clientes_${getSerializationDate()}.txt`;
            triggerLocalDownload(textContent, fileName, 'text/plain');
            alert("El archivo se está guardando localmente.");
        }
    </script>
</body>
</html>
