name: Compilar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Clonar motor de compilación
        run: |
          git clone https://github.com/jipok/WebAPK.git engine
          cd engine
          mkdir -p app/src/main/assets
          
          # Copiar archivos del repositorio al proyecto
          if [ -f ../index.html ]; then cp ../index.html app/src/main/assets/; fi
          if [ -f ../icon.PNG ]; then cp ../icon.PNG app/src/main/res/mipmap-xxhdpi/ic_launcher.png; fi
          if [ -f ../icon.png ]; then cp ../icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png; fi
          
          chmod +x gradlew

      - name: Compilar APK
        run: |
          cd engine
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-control-visitas
          path: engine/app/build/outputs/apk/debug/*.apk
