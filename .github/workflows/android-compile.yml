name: Compilar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar dependencias (si existe package.json)
        run: |
          if [ -f package.json ]; then
            npm install
          fi

      - name: Sincronizar Capacitor
        run: |
          if [ -f package.json ]; then
            npx cap sync android || true
          fi

      - name: Dar permisos de ejecución a Gradle
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Compilar APK Final (Gradle)
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          elif [ -f android/gradlew ]; then
            cd android && ./gradlew assembleDebug --no-daemon
          else
            echo "No se encontró el ejecutable gradlew"
            exit 1
          fi

      - name: Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
