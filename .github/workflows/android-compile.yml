name: Compilar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generar proyecto Android automáticamente con Capacitor
        run: |
          # 1. Crear carpeta web y mover archivos
          mkdir -p www
          cp index.html www/
          if [ -f icon.png ]; then cp icon.png www/; fi
          if [ -f icon.PNG ]; then cp icon.PNG www/; fi
          
          # 2. Inicializar Node y Capacitor
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # 3. Crear plataforma Android
          npx cap init "ControlVisitas" "com.miempresa.controlvisitas" --web-dir www
          npx cap add android
          npx cap copy android

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Final
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
