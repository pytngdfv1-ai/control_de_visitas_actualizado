name: Compilar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Preparar archivos web
        run: |
          mkdir -p www
          cp index.html www/
          if [ -f icon.PNG ]; then cp icon.PNG www/; fi
          if [ -f icon.png ]; then cp icon.png www/; fi

      - name: Generar App Android con Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "Control Visitas" "com.controlvisitas.app" --web-dir www
          npx cap add android
          npx cap copy android

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-control-visitas-apk
          path: android/app/build/outputs/apk/debug/*.apk
