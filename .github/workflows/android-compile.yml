name: Compilar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Preparar archivos web e iconos
        run: |
          mkdir -p www
          cp index.html www/
          if [ -f icon.png ]; then cp icon.png www/; fi
          if [ -f icon.PNG ]; then cp icon.PNG www/; fi
          if [ -f icon.jpg ]; then cp icon.jpg www/; fi
          if [ -f icon.JPG ]; then cp icon.JPG www/; fi

      - name: Generar App Android con Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "Control Visitas" "com.controlvisitas.app" --web-dir www
          npx cap add android
          npx cap copy android

      - name: Reescribir MainActivity con puente nativo
        run: |
          cat << 'EOF' > android/app/src/main/java/com/controlvisitas/app/MainActivity.java
          package com.controlvisitas.app;

          import android.os.Environment;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.io.FileWriter;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onStart() {
                  super.onStart();
                  WebView webView = this.bridge.getWebView();
                  final MainActivity context = this;
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void guardarJSON(String filename, String content) {
                          try {
                              File path = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                              File file = new File(path, filename);
                              FileWriter writer = new FileWriter(file);
                              writer.append(content);
                              writer.flush();
                              writer.close();
                              runOnUiThread(() -> Toast.makeText(context, "Guardado en Descargas", Toast.LENGTH_LONG).show());
                          } catch (Exception e) {}
                      }
                  }, "AndroidApp");
              }
          }
          EOF

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-control-visitas-apk
          path: android/app/build/outputs/apk/debug/*.apk
